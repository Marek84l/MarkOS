palette = "cosmic"
add_newline = true

format = """
[╭─](bold brand)\
[](brand)\
[ M ](fg:text bg:brand bold)\
[](fg:brand bg:user)\
$username\
[](fg:user bg:path)\
$directory\
$git_branch\
$git_status\
[](git)\
$line_break\
[╰─❯](bold brand) """

[username]
show_always = true
style_user = "fg:text bg:user bold"
style_root = "fg:white bg:red bold"
format = "[ $user ]($style)"

[directory]
style = "fg:text bg:path bold"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
style = "fg:text bg:git bold"
format = "[](fg:path bg:git)[ $symbol$branch ]($style)"

[git_status]
style = "fg:text bg:git bold"
format = "[$all_status$ahead_behind ]($style)"

[character]
disabled = true


